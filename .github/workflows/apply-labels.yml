---

# This workflow triages pull requests and applies labels based on the
# paths that are modified in the PR (and the head-branch name).
#
# Configuration: .github/labeler.yml
# Docs: https://github.com/actions/labeler/blob/main/README.md

on:  # yamllint disable-line rule:truthy
  pull_request_target:

name: 🏷️ Add labels

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5

...
